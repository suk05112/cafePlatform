			shellPath = /bin/sh;
			shellScript = "# Firebase Crashlytics Run Script\n# Ensure GoogleService-Info.plist is available for Crashlytics\n\n# Source location (where Setup Firebase Environment script copied it to)\nGOOGLESERVICE_INFO_SOURCE=\"${PROJECT_DIR}/${TARGET_NAME}/GoogleService-Info.plist\"\n\n# Destination in app bundle (where Crashlytics expects it)\nGOOGLESERVICE_INFO_DEST=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}/GoogleService-Info.plist\"\n\n# Check if source file exists\nif [ ! -f \"$GOOGLESERVICE_INFO_SOURCE\" ]; then\n    echo \"❌ Error: GoogleService-Info.plist not found at $GOOGLESERVICE_INFO_SOURCE\"\n    echo \"❌ Please ensure the Setup Firebase Environment script runs before this.\"\n    exit 1\nfi\n\n# Copy GoogleService-Info.plist to app bundle if it doesn't exist there or is outdated\nif [ ! -f \"$GOOGLESERVICE_INFO_DEST\" ] || [ \"$GOOGLESERVICE_INFO_SOURCE\" -nt \"$GOOGLESERVICE_INFO_DEST\" ]; then\n    echo \"📋 Copying GoogleService-Info.plist to app bundle...\"\n    mkdir -p \"$(dirname \"$GOOGLESERVICE_INFO_DEST\")\"\n    cp \"$GOOGLESERVICE_INFO_SOURCE\" \"$GOOGLESERVICE_INFO_DEST\"\n    echo \"✅ GoogleService-Info.plist copied to app bundle\"\nfi\n\n# Verify GOOGLE_APP_ID exists in the plist\nif ! /usr/libexec/PlistBuddy -c \"Print :GOOGLE_APP_ID\" \"$GOOGLESERVICE_INFO_DEST\" > /dev/null 2>&1; then\n    echo \"❌ Error: GOOGLE_APP_ID not found in GoogleService-Info.plist at $GOOGLESERVICE_INFO_DEST\"\n    exit 1\nfi\n\necho \"✅ GoogleService-Info.plist verified (GOOGLE_APP_ID found)\"\n\n# Run Firebase Crashlytics script\n\"${PODS_ROOT}/FirebaseCrashlytics/run\"\n";
		};
