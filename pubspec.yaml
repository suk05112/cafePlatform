  assets:
    - assets/
    - assets/terms/cancellation and refund policy and method.txt
    - assets/terms/Agree to provision of personal (credit) information for payment service.txt
    - assets/terms/refund policy.txt
    - assets/terms/Terms of Use.txt
    - assets/terms/privacy_policy_required.txt
    - assets/terms/terms_marketing_optional.txt
    - assets/terms/usage_guide.txt
    - assets/chevron-right.png
    - assets/coffee.jpeg
    - assets/coffee.png
    - assets/menu.png
    - assets/gifnut_logo.svg
