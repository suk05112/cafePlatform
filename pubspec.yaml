  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

flavors:
    dev:
      ios:
        bundleId: com.yourcompany.gfinut.dev
    prod:
      ios:
        bundleId: com.yourcompany.gfinut


